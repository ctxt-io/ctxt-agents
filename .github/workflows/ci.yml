name: ci
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: All JSON files parse
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -I{} python3 -m json.tool {} /dev/null

      - name: Codex and Cursor general-service skill copies are identical
        run: |
          set -e
          diff -r codex/ctxt/skills cursor/ctxt/skills

      - name: No legacy commands directories (skills already register the slash command)
        run: |
          set -e
          ! find plugins cursor codex -type d -name commands | grep .

      - name: Plugin manifest versions match
        run: |
          python3 - <<'EOF'
          import json
          claude = json.load(open('plugins/ctxt/.claude-plugin/plugin.json'))
          codex = json.load(open('codex/ctxt/.codex-plugin/plugin.json'))
          cursor = json.load(open('cursor/ctxt/.cursor-plugin/plugin.json'))
          versions = {'claude': claude['version'], 'codex': codex['version'],
                      'cursor': cursor['version']}
          assert len(set(versions.values())) == 1, (
              'bump all three manifests together: %s' % versions)
          assert claude['name'] == codex['name'] == cursor['name'] == 'ctxt', (
              'the plugin name is a permanent identifier')
          EOF

      - name: Every plugin points at its intended MCP endpoint
        run: |
          python3 - <<'EOF'
          import json
          # Three files, three shapes: Claude and Cursor wrap servers in
          # "mcpServers" (Cursor reads mcp.json at the plugin root, Claude
          # .mcp.json), Codex names the server at the top level.
          # Claude uses the free directory profile; Codex and Cursor
          # retain the general-service profile.
          urls = {}
          for path in ('plugins/ctxt/.mcp.json', 'codex/ctxt/.mcp.json',
                       'cursor/ctxt/mcp.json'):
              cfg = json.load(open(path))
              servers = cfg.get('mcpServers', cfg)
              assert list(servers) == ['ctxt'], (path, list(servers))
              urls[path] = servers['ctxt']['url']
          assert urls == {
              'plugins/ctxt/.mcp.json': 'https://ctxt.io/mcp/openai',
              'codex/ctxt/.mcp.json': 'https://ctxt.io/mcp',
              'cursor/ctxt/mcp.json': 'https://ctxt.io/mcp',
          }, urls
          EOF

      - name: Codex marketplace policy enums are valid
        run: |
          python3 - <<'EOF'
          import json
          # JSON that parses can still carry invalid enums (an earlier
          # revision shipped authentication=ON_FIRST_USE, which Codex
          # rejects). Pin the currently documented values; replace this
          # with a real `codex plugin marketplace validate` when one
          # exists in CI-friendly form.
          mp = json.load(open('.agents/plugins/marketplace.json'))
          for p in mp['plugins']:
              policy = p.get('policy', {})
              inst = policy.get('installation')
              auth = policy.get('authentication')
              assert inst in ('AVAILABLE', 'INSTALLED_BY_DEFAULT',
                              'NOT_AVAILABLE'), inst
              assert auth in ('ON_INSTALL', 'ON_USE'), auth
          EOF
